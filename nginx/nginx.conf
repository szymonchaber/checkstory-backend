events { worker_connections 1024; }

http {

    gzip on;
    gzip_disable "msie6";
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name api.checkstory.tech;
        server_tokens off;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 308 https://$host$request_uri;
        }
    }

    server {
        listen 443 default_server ssl;
        server_name api.checkstory.tech;

        ssl_certificate /etc/letsencrypt/live/api.checkstory.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.checkstory.tech/privkey.pem;
        #include /etc/letsencrypt/options-ssl-nginx.conf;
        #ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {

            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection $http_connection;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-Request $request;

            proxy_redirect off;
            proxy_buffering off;
        }
    }
}
