version: '3.8'

name: checkstory-backend

services:
  backend:
    build: .
    environment:
      JAVA_OPTS: ${JAVA_OPTS}
      POSTGRES_CONNECTION_STRING: ${POSTGRES_CONNECTION_STRING}
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
      PLAY_BILLING_PUBSUB_SUBSCRIPTION_NAME: ${PLAY_BILLING_PUBSUB_SUBSCRIPTION_NAME}
    entrypoint: java -jar /app/checkstory-docker.jar $JAVA_OPTS
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: checkstory
      POSTGRES_USER: checkstory
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - services

networks:
  services:
    driver: bridge

volumes:
  postgres_data:

