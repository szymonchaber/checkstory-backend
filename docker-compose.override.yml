version: '3.8'

name: checkstory-backend

services:
  backend:
    image: !reset null
    build: .
    environment:
      JAVA_OPTS: ${JAVA_OPTS}
    entrypoint: java -jar /app/checkstory-docker.jar $JAVA_OPTS
  esdb:
    image: eventstore/eventstore:22.10.3-alpha-arm64v8

networks:
  services:
    driver: bridge

volumes:
  postgres_data:
  eventstore_data:
  eventstore_logs:
  nginx_conf:
  certbot_conf:
  certbot_www:

