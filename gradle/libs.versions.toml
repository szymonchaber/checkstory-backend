[versions]

ktor = "2.3.2"
kotlin = "1.9.10"
postgres = "42.7.1"
h2 = "2.2.220"
exposed = "0.47.0"

[libraries]
kotlinx-datetime = "org.jetbrains.kotlinx:kotlinx-datetime:0.4.0"
postgres = { module = "org.postgresql:postgresql", version.ref = "postgres" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
logback = "ch.qos.logback:logback-classic:1.4.12"
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
exposed-kotlin-datetime = { module = "org.jetbrains.exposed:exposed-kotlin-datetime", version.ref = "exposed" }
exposed-dao = { module = "org.jetbrains.exposed:exposed-dao", version.ref = "exposed" }
retry = "com.michael-bull.kotlin-retry:kotlin-retry:1.0.9"
kodein = "org.kodein.di:kodein-di-jvm:7.20.1"
calendar-rrule = "com.github.PhilJay:RRule:1.0.3"
firebase-admin = "com.google.firebase:firebase-admin:9.1.1"
google-cloud-bom = "com.google.cloud:libraries-bom:26.14.0"
google-cloud-pubsub = { module = "com.google.cloud:google-cloud-pubsub" }

google-api-client = "com.google.api-client:google-api-client:1.32.1"
google-api-android = "com.google.apis:google-api-services-androidpublisher:v3-rev20230511-2.0.0"

ktor-server-core-jvm = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-auth-jvm = { module = "io.ktor:ktor-server-auth-jvm", version.ref = "ktor" }
ktor-server-host-common-jvm = { module = "io.ktor:ktor-server-host-common-jvm", version.ref = "ktor" }
ktor-server-status-pages-jvm = { module = "io.ktor:ktor-server-status-pages-jvm", version.ref = "ktor" }
ktor-server-default-headers-jvm = { module = "io.ktor:ktor-server-default-headers-jvm", version.ref = "ktor" }
ktor-server-http-redirect-jvm = { module = "io.ktor:ktor-server-http-redirect-jvm", version.ref = "ktor" }
ktor-server-cors-jvm = { module = "io.ktor:ktor-server-cors-jvm", version.ref = "ktor" }
ktor-server-forwarded-header = { module = "io.ktor:ktor-server-forwarded-header", version.ref = "ktor" }
ktor-server-openapi = { module = "io.ktor:ktor-server-openapi", version.ref = "ktor" }
ktor-server-swagger = { module = "io.ktor:ktor-server-swagger", version.ref = "ktor" }
ktor-server-call-logging-jvm = { module = "io.ktor:ktor-server-call-logging-jvm", version.ref = "ktor" }
ktor-server-metrics-jvm = { module = "io.ktor:ktor-server-metrics-jvm", version.ref = "ktor" }
ktor-server-content-negotiation-jvm = { module = "io.ktor:ktor-server-content-negotiation-jvm", version.ref = "ktor" }
ktor-serialization-kotlinx-json-jvm = { module = "io.ktor:ktor-serialization-kotlinx-json-jvm", version.ref = "ktor" }
ktor-server-netty-jvm = { module = "io.ktor:ktor-server-netty-jvm", version.ref = "ktor" }

ktor-client-core-jvm = { module = "io.ktor:ktor-client-core-jvm", version.ref = "ktor" }
ktor-client-apache-jvm = { module = "io.ktor:ktor-client-apache-jvm", version.ref = "ktor" }

hikari = "com.zaxxer:HikariCP:5.1.0"

kotlin-test = "org.jetbrains.kotlin:kotlin-test-junit:1.9.10"
junit = "org.junit.jupiter:junit-jupiter:5.9.2"
ktor-server-tests = { module = "io.ktor:ktor-server-tests-jvm", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host-jvm", version.ref = "ktor" }
mockito = "org.mockito.kotlin:mockito-kotlin:5.1.0"

[bundles]

exposed = [
    "exposed-core",
    "exposed-jdbc",
    "exposed-kotlin-datetime",
    "exposed-dao",
]

ktor-config = [
    "ktor-server-host-common-jvm",
    "ktor-server-status-pages-jvm",
    "ktor-server-default-headers-jvm",
    "ktor-server-http-redirect-jvm",
    "ktor-server-cors-jvm",
    "ktor-server-forwarded-header",
    "ktor-server-openapi",
    "ktor-server-swagger",
    "ktor-server-call-logging-jvm",
    "ktor-server-metrics-jvm",
    "ktor-server-content-negotiation-jvm",
    "ktor-serialization-kotlinx-json-jvm",
]

google-play = [
    "google-api-client",
    "google-api-android",
]

test = [
    "kotlin-test",
    "junit",
    "ktor-server-tests",
    "ktor-server-test-host",
    "mockito",
]

[plugins]
