version: '3.8'

name: checkstory-backend

services:
  backend:
    image: ghcr.io/szymonchaber/checkstory-backend:master
    restart: always
    ports:
      - "8080:8080"
    networks:
      - services
    environment:
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      EVENTSTORE_CONNECTION_STRING: ${EVENTSTORE_CONNECTION_STRING}
      POSTGRES_CONNECTION_STRING: ${POSTGRES_CONNECTION_STRING}
    depends_on:
      esdb:
        condition: service_healthy

  esdb:
    image: eventstore/eventstore:latest
    #    image: eventstore/eventstore:22.10.3-alpha-arm64v8
    environment:
      - EVENTSTORE_CLUSTER_SIZE=1
      - EVENTSTORE_RUN_PROJECTIONS=All
      - EVENTSTORE_START_STANDARD_PROJECTIONS=true
      - EVENTSTORE_EXT_TCP_PORT=1113
      - EVENTSTORE_HTTP_PORT=2113
      - EVENTSTORE_INSECURE=true
      - EVENTSTORE_ENABLE_EXTERNAL_TCP=true
      - EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP=true
    ports:
      - "1113:1113"
      - "2113:2113"
    networks:
      services:
    volumes:
      - eventstore_data:/var/lib/eventstore
      - eventstore_logs:/var/log/eventstore
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --insecure http://esdb:2113/health/live || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
  #endregion

  certbot:
    image: certbot/certbot:latest
    networks:
      - services
    volumes:
      - certbot_conf:/etc/letsencrypt:rw
      - certbot_www:/var/www/certbot:rw
  nginx:
    image: nginx
    restart: always
    volumes:
      - ~/nginx:/etc/nginx:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - services
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_started

networks:
  services:
    driver: bridge

volumes:
  postgres_data:
  eventstore_data:
  eventstore_logs:
  nginx_conf:
  certbot_conf:
  certbot_www:

