version: '3.8'

services:
  backend:
    image: us-central1-docker.pkg.dev/checkstory-940fc/checkstory-images/checkstory-backend
    restart: always
    ports:
      - "8080:8080"
    networks:
      - services
    environment:
      ESDB_CONNECTION_STRING: 'esdb://esdb-node:2113?tls=false&keepAliveTimeout=10000&keepAliveInterval=10000'
      POSTGRES_URL: 'jdbc:postgresql://postgresql:5432/postgres'
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'replace'
    depends_on:
      postgresql:
        condition: service_healthy
      esdb-node:
        condition: service_healthy
  postgresql:
    image: postgres:latest
    restart: always
    networks:
      - services
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: 'replace'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 1s
  esdb-node:
    #    image: eventstore/eventstore:22.10.1-alpha-arm64v8
    image: eventstore/eventstore:latest
    environment:
      - EVENTSTORE_CLUSTER_SIZE=1
      - EVENTSTORE_RUN_PROJECTIONS=All
      - EVENTSTORE_START_STANDARD_PROJECTIONS=true
      - EVENTSTORE_EXT_TCP_PORT=1113
      - EVENTSTORE_HTTP_PORT=2113
      - EVENTSTORE_INSECURE=true
      - EVENTSTORE_ENABLE_EXTERNAL_TCP=true
      - EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP=true
    restart: always
    networks:
      - services
    ports:
      - "2113:2113"
      - "1113:1113"
    volumes:
      - eventstore_data:/var/lib/eventstore
      - eventstore_logs:/var/log/eventstore
  certbot:
    image: certbot/certbot:latest
    networks:
      - services
    volumes:
      - certbot_conf:/etc/letsencrypt:rw
      - certbot_www:/var/www/certbot:rw
  nginx:
    image: nginx
    restart: always
    volumes:
      - nginx_conf:/etc/nginx:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - services
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_started

networks:
  services:

volumes:
  postgres_data:
  eventstore_data:
  eventstore_logs:
  nginx_conf:
  certbot_conf:
  certbot_www:
