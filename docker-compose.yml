version: '3.8'

name: checkstory-backend

services:
  backend:
    image: ghcr.io/szymonchaber/checkstory-backend:master
    restart: always
    ports:
      - "8080:8080"
    networks:
      - services
    environment:
      POSTGRES_CONNECTION_STRING: ${POSTGRES_CONNECTION_STRING}
      SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}

  certbot:
    image: certbot/certbot:latest
    networks:
      - services
    volumes:
      - certbot_conf:/etc/letsencrypt:rw
      - certbot_www:/var/www/certbot:rw
  nginx:
    image: nginx
    restart: always
    volumes:
      - ~/nginx:/etc/nginx:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - services
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_started

networks:
  services:
    driver: bridge

volumes:
  nginx_conf:
  certbot_conf:
  certbot_www:

