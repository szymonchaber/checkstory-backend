version: '3.8'

name: checkstory-backend

services:
  backend:
    image: ghcr.io/szymonchaber/checkstory-backend:master
    restart: always
    ports:
      - "8080:8080"
    networks:
      - services
    environment:
      ESDB_CONNECTION_STRING: 'esdb://esdb-node-1:2113,esdb-node-2:2113,esdb-node-3:2113?keepAliveTimeout=10000&keepAliveInterval=10000'
      POSTGRES_URL: 'jdbc:postgresql://postgresql:5432/postgres'
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgresql:
        condition: service_healthy
      esdb-node:
        condition: service_healthy
      esdb-node-1:
        condition: service_healthy
      esdb-node-2:
        condition: service_healthy
      esdb-node-3:
        condition: service_healthy

  postgresql:
    image: postgres:15.4
    restart: always
    networks:
      - services
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 1s

  #region esdb
  volumes-provisioner:
    image: hasnat/volumes-provisioner
    environment:
      PROVISION_DIRECTORIES: "1000:1000:0755:/tmp/certs"
    volumes:
      - eventstore_certs:/tmp/certs
    network_mode: none

  cert-gen:
    image: eventstore/es-gencert-cli:1.0.2
    entrypoint: bash
    user: "1000:1000"
    command: >
      -c "mkdir -p ./certs && cd /certs
      && es-gencert-cli create-ca
      && es-gencert-cli create-node -out ./node-1 -dns-names localhost,esdb-node-1
      && es-gencert-cli create-node -out ./node-2 -dns-names localhost,esdb-node-2
      && es-gencert-cli create-node -out ./node-3 -dns-names localhost,esdb-node-3
      && find . -type f -print0 | xargs -0 chmod 666"
    volumes:
      - eventstore_certs:/certs
    depends_on:
      - volumes-provisioner

  esdb-node-1:
    image: eventstore/eventstore:latest
    env_file:
      - event_store_shared.env
    environment:
      - EVENTSTORE_GOSSIP_SEED=esdb-node-2:2113,esdb-node-3:2113
      - EVENTSTORE_CERTIFICATE_FILE=/etc/eventstore/certs/node-1/node.crt
      - EVENTSTORE_CERTIFICATE_PRIVATE_KEY_FILE=/etc/eventstore/certs/node-1/node.key
      - EVENTSTORE_ADVERTISE_HOST_TO_CLIENT_AS=esdb-node-3
      - EVENTSTORE_ADVERTISE_HTTP_PORT_TO_CLIENT_AS=2111
      - EVENTSTORE_ADVERTISE_TCP_PORT_TO_CLIENT_AS=1111
    ports:
      - "1111:1113"
      - "2111:2113"
    volumes:
      - eventstore_certs:/etc/eventstore/certs
      - eventstore_data_1:/var/lib/eventstore
      - eventstore_logs_1:/var/log/eventstore
    restart: unless-stopped
    networks:
      - services
    depends_on:
      - cert-gen

  esdb-node-2:
    image: eventstore/eventstore:latest
    env_file:
      - event_store_shared.env
    environment:
      - EVENTSTORE_GOSSIP_SEED=esdb-node-1:2113,esdb-node-3:2113
      - EVENTSTORE_CERTIFICATE_FILE=/etc/eventstore/certs/node-2/node.crt
      - EVENTSTORE_CERTIFICATE_PRIVATE_KEY_FILE=/etc/eventstore/certs/node-2/node.key
      - EVENTSTORE_ADVERTISE_HOST_TO_CLIENT_AS=esdb-node-3
      - EVENTSTORE_ADVERTISE_HTTP_PORT_TO_CLIENT_AS=2112
      - EVENTSTORE_ADVERTISE_TCP_PORT_TO_CLIENT_AS=1112
    ports:
      - "1112:1113"
      - "2112:2113"
    volumes:
      - eventstore_certs:/etc/eventstore/certs
      - eventstore_data_2:/var/lib/eventstore
      - eventstore_logs_2:/var/log/eventstore
    restart: unless-stopped
    networks:
      - services
    depends_on:
      - cert-gen

  esdb-node-3:
    image: eventstore/eventstore:latest
    env_file:
      - event_store_shared.env
    environment:
      - EVENTSTORE_GOSSIP_SEED=esdb-node-1:2113,esdb-node-2:2113
      - EVENTSTORE_CERTIFICATE_FILE=/etc/eventstore/certs/node-3/node.crt
      - EVENTSTORE_CERTIFICATE_PRIVATE_KEY_FILE=/etc/eventstore/certs/node-3/node.key
      - EVENTSTORE_ADVERTISE_HOST_TO_CLIENT_AS=esdb-node-3
      - EVENTSTORE_ADVERTISE_HTTP_PORT_TO_CLIENT_AS=2113
      - EVENTSTORE_ADVERTISE_TCP_PORT_TO_CLIENT_AS=1113
    ports:
      - "1113:1113"
      - "2113:2113"
    volumes:
      - eventstore_certs:/etc/eventstore/certs
      - eventstore_data_3:/var/lib/eventstore
      - eventstore_logs_3:/var/log/eventstore
    restart: unless-stopped
    networks:
      - services
    depends_on:
      - cert-gen
  #endregion

  # region esdb-legacy
  esdb-node:
    image: eventstore/eventstore:latest
    environment:
      - EVENTSTORE_CLUSTER_SIZE=1
      - EVENTSTORE_RUN_PROJECTIONS=All
      - EVENTSTORE_START_STANDARD_PROJECTIONS=true
      - EVENTSTORE_EXT_TCP_PORT=1113
      - EVENTSTORE_HTTP_PORT=2113
      - EVENTSTORE_INSECURE=true
      - EVENTSTORE_ENABLE_EXTERNAL_TCP=true
      - EVENTSTORE_ENABLE_ATOM_PUB_OVER_HTTP=true
    restart: always
    networks:
      - services
    ports:
      - "1114:1113"
      - "2114:2113"
    volumes:
      - eventstore_data:/var/lib/eventstore
      - eventstore_logs:/var/log/eventstore
  # endregion

  certbot:
    image: certbot/certbot:latest
    networks:
      - services
    volumes:
      - certbot_conf:/etc/letsencrypt:rw
      - certbot_www:/var/www/certbot:rw
  nginx:
    image: nginx
    restart: always
    volumes:
      - ~/nginx:/etc/nginx:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - services
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_started

networks:
  services:

volumes:
  postgres_data:
  eventstore_data:
  eventstore_logs:
  eventstore_data_1:
  eventstore_logs_1:
  eventstore_data_2:
  eventstore_logs_2:
  eventstore_data_3:
  eventstore_logs_3:
  eventstore_certs:
  nginx_conf:
  certbot_conf:
  certbot_www:

