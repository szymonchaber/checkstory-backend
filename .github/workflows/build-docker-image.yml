name: Build docker image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Java JDK
      uses: actions/setup-java@v3.12.0
      with:
          distribution: 'zulu'
          java-version: '17'
    - name: Build Backend Jar
      run: ./gradlew buildFatJar
    - uses: actions/checkout@v3
    - name: Build the Docker image
      run: docker build --platform=linux/amd64 -t us-central1-docker.pkg.dev/checkstory-940fc/checkstory-images/checkstory-backend .
