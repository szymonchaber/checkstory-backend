name: Deploy new Docker Compose file without building backend

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_KEY" > ~/.ssh/production.key
          chmod 600 ~/.ssh/production.key
          cat >>~/.ssh/config <<END
          Host production
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/production.key
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.PRODUCTION_USER }}
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
      - name: Deploy the new service
        run: |
          scp docker-compose.yml production:~/docker-compose.yml
          scp event_store_shared.env production:~/event_store_shared.env
          scp -r nginx production:~/
          ssh production << END
            export POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            export EVENTSTORE_DEFAULT_ADMIN_PASSWORD=$EVENTSTORE_DEFAULT_ADMIN_PASSWORD
            export EVENTSTORE_DEFAULT_OPS_PASSWORD=$EVENTSTORE_DEFAULT_OPS_PASSWORD

            echo $GH_CONTAINER_REGISTRY_TOKEN | docker login ghcr.io -u szymonchaber --password-stdin
            docker compose down
            docker compose pull
            docker compose up -d
          END
        env:
          GH_CONTAINER_REGISTRY_TOKEN: ${{ secrets.GH_CONTAINER_REGISTRY_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.PRODUCTION_POSTGRES_PASSWORD }}
          EVENTSTORE_DEFAULT_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_EVENTSTORE_ADMIN_PASSWORD }}
          EVENTSTORE_DEFAULT_OPS_PASSWORD: ${{ secrets.PRODUCTION_EVENTSTORE_OPS_PASSWORD }}
